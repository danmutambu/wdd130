<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact White Water Rafting for reservations, general inquiries, or website feedback. View our address, phone number, email, map, and team.">
  <meta name="author" content="Dan Eliezer Mutambu Mbula">
  <title>Contact Us - White Water Rafting</title>
  <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
  <header>
    <div class="logo-box">
      <img src="images/logo.png" alt="Rafting Site Logo">
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="trips.html">Trips</a>
      <a href="contact.html">Contact Us</a>
    </nav>
  </header>

  <main>
    <section class="company-info">
      <h1>Contact White Water Rafting</h1>
      <p><strong>White Water Rafting Company</strong></p>
      <p>123 Main River Street, Kolob, California</p>
      <p>Phone: +1 999 999 9999</p>
      <p>Email: info@whitewater.com</p>

      <div class="map-box">
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d406128.83011778217!2d-113.37289079307008!3d37.32163490127827!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x80caead08844f8d9%3A0x7c2e3a15aa3656f5!2sParc%20national%20de%20Zion!5e0!3m2!1sfr!2scd!4v1795694669476!5m2!1sfr!2scd" width="600" height="450" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
      </div>
    </section>

    <section class="contact-form-section">
      <h2>Send Us a Message</h2>
      <form action="#" method="post">
        <div class="form-group">
          <label for="fullname">Name:</label>
          <input type="text" id="fullname" name="fullname" placeholder="Your full name" required>
        </div>

        <div class="form-group">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>

        <fieldset class="form-group">
          <legend>Message Purpose:</legend>
          <div class="radio-option">
            <input type="radio" id="purpose-general" name="purpose" value="general-inquiry" required>
            <label for="purpose-general">General Inquiry</label>
          </div>
          <div class="radio-option">
            <input type="radio" id="purpose-reservation" name="purpose" value="reservation-question">
            <label for="purpose-reservation">Reservation Question</label>
          </div>
          <div class="radio-option">
            <input type="radio" id="purpose-suggestion" name="purpose" value="website-suggestion">
            <label for="purpose-suggestion">Website Suggestion</label>
          </div>
        </fieldset>

        <div class="form-group">
          <label for="message">Message:</label>
          <textarea id="message" name="message" rows="4" placeholder="Type your message here..." required></textarea>
        </div>

        <div class="form-group checkbox-option">
          <input type="checkbox" id="newsletter" name="newsletter" value="yes">
          <label for="newsletter">Please subscribe me to the monthly newsletter</label>
        </div>

        <button type="submit" class="submit-btn">Send Message</button>
      </form>
    </section>

    <section class="team-section">
      <h2>We Are Here to Serve You</h2>
      <div class="employee-grid">
        <figure>
          <img src="images/employee1.jpg" alt="Portrait of River Guide Alex Morgan">
          <figcaption>Alex Morgan - Lead River Guide</figcaption>
        </figure>
        <figure>
          <img src="images/employee2.jpg" alt="Portrait of Operations Manager Jordan Lee">
          <figcaption>Jordan Lee - Operations Manager</figcaption>
        </figure>
        <figure>
          <img src="images/employee3.jpg" alt="Portrait of Guest Relations Coordinator Taylor Brooks">
          <figcaption>Taylor Brooks - Guest Relations Coordinator</figcaption>
        </figure>
      </div>
    </section>

  </main>

  <footer>
    <p>&copy; 2026 White Water Rafting. All rights reserved.</p>
    <nav class="socialmedia">
      <a href="https://facebook.com" target="_blank">
        <img src="images/facebook.svg" alt="Facebook Icon">
      </a>
      <a href="https://instagram.com" target="_blank">
        <img src="images/instagram.svg" alt="Instagram Icon">
      </a>
      <a href="https://linkedin.com" target="_blank">
        <img src="images/linkedin.png" alt="LinkedIn Icon">
      </a>
    </nav>
  </footer>
</body>

</html>
